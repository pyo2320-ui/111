<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단독주택 수도요금 정산기</title>
<!-- Tailwind CSS CDN -->
<script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
body {
font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
<div class="max-w-5xl mx-auto space-y-6">
<!-- 헤더 -->
<header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
<div>
<h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
<svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
단독주택 수도요금 정산기
</h1>
<p class="text-sm text-slate-500 mt-1">가구별 인원수 및 기초생활수급자 감면을 반영한 공정한 수도요금 정산 시스템</p>
</div>
<button onclick="resetToDefault()" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
기초 셋팅 초기화
</button>
</header>
<!-- 메인 요금 입력 섹션 -->
<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
<h2 class="text-lg font-semibold text-slate-900 border-b pb-3">1. 고지서 기본 정보 입력</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
<div>
<label class="block text-xs font-medium text-slate-600 mb-1">총 사용량 (m^3)</label>
<input type="number" id="totalUsage" value="45" oninput="calculate()" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-right font-medium">
</div>
<div>
<label class="block text-xs font-medium text-slate-600 mb-1">상수도 요금 (원)</label>
<input type="number" id="waterFee" value="31500" oninput="calculate()" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-right font-medium">
</div>
<div>
<label class="block text-xs font-medium text-slate-600 mb-1">하수도 요금 (원)</label>
<input type="number" id="sewageFee" value="18000" oninput="calculate()" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-right font-medium">
</div>
<div>
<label class="block text-xs font-medium text-slate-600 mb-1">물이용부담금 (원)</label>
<input type="number" id="levyFee" value="7600" oninput="calculate()" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-right font-medium">
</div>
</div>
</section>
<!-- 가구별 상세 정보 설정 -->
<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
<div class="flex justify-between items-center border-b pb-3">
<h2 class="text-lg font-semibold text-slate-900">2. 가구별 구성원 및 감면 설정</h2>
<button onclick="addHousehold()" class="px-3 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition-colors">
+ 가구 추가
</button>
</div>
<div id="householdList" class="space-y-3">
<!-- 자바스크립트로 동적 생성됨 -->
</div>
</section>
<!-- 정산 결과 요약 -->
<section class="bg-slate-900 text-white rounded-2xl p-6 shadow-lg space-y-6">
<div class="flex justify-between items-center border-b border-slate-800 pb-4">
<h2 class="text-lg font-semibold">3. 최종 정산 내역</h2>
<span id="sumCheck" class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-medium">금액 일치</span>
</div>
<div id="resultList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
<!-- 결과 카드 동적 생성 -->
</div>
<div class="pt-4 border-t border-slate-800 flex flex-col md:flex-row justify-between items-center text-sm text-slate-400 gap-2">
<p id="totalSummaryText">총 청구금액: 0원</p>
<button onclick="window.print()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-medium transition-colors">
인쇄하기 / PDF 저장
</button>
</div>
</section>
</div>
<script>
let households = [
{ id: 1, name: "1층 (집주인)", people: 2, welfare: false },
{ id: 2, name: "201호", people: 1, welfare: true },
{ id: 3, name: "202호", people: 2, welfare: false }
];
function renderHouseholds() {
const container = document.getElementById('householdList');
container.innerHTML = '';
households.forEach((h, index) => {
const item = document.createElement('div');
item.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 p-4 bg-slate-50 rounded-xl border border-slate-200";
item.innerHTML = <div class="flex items-center gap-3 w-full sm:w-auto"> <span class="w-6 h-6 flex items-center justify-center bg-blue-100 text-blue-700 text-xs font-bold rounded-full">${index + 1}</span> <input type="text" value="${h.name}" onchange="updateName(${h.id}, this.value)" class="px-3 py-1.5 border rounded-lg text-sm font-medium w-36 bg-white"> </div> <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end"> <div class="flex items-center gap-1.5"> <label class="text-xs text-slate-500">거주 인원</label> <input type="number" min="1" value="${h.people}" onchange="updatePeople(${h.id}, this.value)" class="w-16 px-2 py-1 border rounded-lg text-center text-sm bg-white font-medium"> <span class="text-xs text-slate-500">명</span> </div> <label class="flex items-center gap-1.5 cursor-pointer"> <input type="checkbox" ${h.welfare ? 'checked' : ''} onchange="updateWelfare(${h.id}, this.checked)" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500"> <span class="text-xs font-medium text-slate-700">기초수급자 감면</span> </label> <button onclick="removeHousehold(${h.id})" class="text-slate-400 hover:text-red-500 text-xs px-2 py-1 transition-colors">삭제</button> </div>;
container.appendChild(item);
});
calculate();
}
function addHousehold() {
const newId = households.length > 0 ? Math.max(...households.map(h => h.id)) + 1 : 1;
households.push({ id: newId, name: ${newId}호실, people: 1, welfare: false });
renderHouseholds();
}
function removeHousehold(id) {
if (households.length <= 1) {
alert("최소 1개의 가구는 존재해야 합니다.");
return;
}
households = households.filter(h => h.id !== id);
renderHouseholds();
}
function updateName(id, val) {
const h = households.find(x => x.id === id);
if (h) h.name = val;
}
function updatePeople(id, val) {
const h = households.find(x => x.id === id);
if (h) {
h.people = parseInt(val) || 1;
calculate();
}
}
function updateWelfare(id, val) {
const h = households.find(x => x.id === id);
if (h) {
h.welfare = val;
calculate();
}
}
function resetToDefault() {
households = [
{ id: 1, name: "1층 (집주인)", people: 2, welfare: false },
{ id: 2, name: "201호", people: 1, welfare: true },
{ id: 3, name: "202호", people: 2, welfare: false }
];
document.getElementById('totalUsage').value = 45;
document.getElementById('waterFee').value = 31500;
document.getElementById('sewageFee').value = 18000;
document.getElementById('levyFee').value = 7600;
renderHouseholds();
}
function calculate() {
const totalUsage = parseFloat(document.getElementById('totalUsage').value) || 0;
const waterFee = parseFloat(document.getElementById('waterFee').value) || 0;
const sewageFee = parseFloat(document.getElementById('sewageFee').value) || 0;
const levyFee = parseFloat(document.getElementById('levyFee').value) || 0;
const totalBill = waterFee + sewageFee + levyFee;
const totalPeople = households.reduce((sum, h) => sum + h.people, 0);
const resultContainer = document.getElementById('resultList');
resultContainer.innerHTML = '';
let calculatedSum = 0;
households.forEach(h => {
const ratio = totalPeople > 0 ? (h.people / totalPeople) : 0;
let shareWater = waterFee * ratio;
let shareSewage = sewageFee * ratio;
let shareLevy = levyFee * ratio;
let shareUsage = totalUsage * ratio;
// 기초생활수급자 감면 (예시: 상수도 기본요금 및 일정 금액 감면 혹은 5천원 정액 지원 예시 시뮬레이션 로직)
let discount = h.welfare ? 5000 : 0;
let finalAmount = Math.round((shareWater + shareSewage + shareLevy - discount) / 10) * 10; // 10원 단위 반올림
if (finalAmount < 0) finalAmount = 0;
calculatedSum += finalAmount;
const card = document.createElement('div');
card.className = "bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 space-y-3";
card.innerHTML = <div class="flex justify-between items-center"> <h3 class="font-bold text-white text-base">${h.name}</h3> <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md">${h.people}명 거주</span> </div> <div class="space-y-1 text-xs text-slate-300"> <div class="flex justify-between"><span>예상 사용량:</span> <span class="font-medium text-white">${shareUsage.toFixed(1)} m³</span></div> <div class="flex justify-between"><span>상/하수도 및 부담금:</span> <span class="font-medium text-white">${Math.round(shareWater + shareSewage + shareLevy).toLocaleString()}원</span></div> ${h.welfare ?<div class="flex justify-between text-emerald-400"><span>수급자 감면 적용:</span> <span>-5,000원</span></div>: ''} </div> <div class="pt-3 border-t border-slate-700 flex justify-between items-center"> <span class="text-xs text-slate-400 font-medium">최종 납부액</span> <span class="text-lg font-bold text-blue-400">${finalAmount.toLocaleString()}원</span> </div>;
resultContainer.appendChild(card);
});
document.getElementById('totalSummaryText').innerText = 고지서 총 청구금액: ${totalBill.toLocaleString()}원 (정산 합계: ${calculatedSum.toLocaleString()}원);
}
// 초기 렌더링 실행
renderHouseholds();
</script>
</body>
</html>
